name: Publicar release POSmelon

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Extraer versión del tag
        id: get-version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publicar aplicación
        run: dotnet publish DrogueriaPOS.WPF -c Release -o publish -r win-x64 --self-contained true

      - name: Crear y publicar release con Velopack
        run: |
          dotnet tool install -g vpk
          vpk download github --repoUrl https://github.com/${{ github.repository }}
          vpk pack -u POSmelon -v ${{ steps.get-version.outputs.version }} -p publish -e POSmelon.exe --packTitle "POSmelon" --icon DrogueriaPOS.WPF\Assets\icon.ico
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "POSmelon ${{ steps.get-version.outputs.version }}" --tag ${{ github.ref_name }} --token ${{ secrets.GITHUB_TOKEN }}
